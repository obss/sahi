version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 👷
    target-branch: "main"
  # Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: ⬆️
    target-branch: "main"
    groups:
      # torchvision pins an exact torch, so both have to move in one PR
      pytorch:
        patterns:
          - "torch"
          - "torchvision"
